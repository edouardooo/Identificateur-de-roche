name: Backup la carte des kayous Umap

on:
  schedule:
    - cron: '0 0 * * *'  # Exécute tous les jours à minuit
  workflow_dispatch:  # Permet de lancer manuellement

# Autorise le workflow à enregistrer la sauvegarde dans le dépôt
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install requests

    - name: Run backup script
      run: python backup.py

    - name: Enregistrer la sauvegarde sur GitHub
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add backups
        if git diff --cached --quiet; then
          echo "Rien de nouveau à enregistrer."
        else
          git commit -m "Backup automatique de la carte des kayous"
          git push
        fi
