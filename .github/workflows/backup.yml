name: Backup la carte des kayous Umap

on:
  schedule:
    - cron: '0 0 * * *'  # Exécute tous les jours à minuit
  workflow_dispatch:  # Permet de lancer manuellement

# Autorise le workflow à enregistrer la sauvegarde dans le dépôt
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    # Sans activité pendant 7 jours, Supabase met la photothèque en pause.
    # La clé « publishable » est publique par nature : elle ne permet que d'appeler ping().
    - name: Garder Supabase éveillé
      run: >
        curl -fsS -X POST "https://vriscloogmgeyjfzffsz.supabase.co/rest/v1/rpc/ping"
        -H "apikey: sb_publishable_9M1ByaYr1-j5jsNUZ-qz2A_ehCur7rK"
        -H "Content-Type: application/json" -d "{}"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install requests

    - name: Run backup script
      run: python backup.py

    - name: Enregistrer la sauvegarde sur GitHub
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add backups
        if git diff --cached --quiet; then
          echo "Rien de nouveau à enregistrer."
        else
          git commit -m "Backup automatique de la carte des kayous"
          git push
        fi
